<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FairShed - fair load-shedding planner</title>
  <meta name="description" content="FairShed dashboard. Simulator only, synthetic data.">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/screens.css">
  <link rel="preload" href="vendor/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="vendor/fonts/ibm-plex-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="app">
    <nav class="rail" id="rail" aria-label="Screens">
      <div class="rail-brand" aria-hidden="true">FairShed</div>
    </nav>
    <div class="col">
      <header class="topbar">
        <div class="screen-title" id="screen-title">Plan</div>
        <span class="sep" aria-hidden="true"></span>
        <span class="badge" id="badge-sim" title="Every feeder, demand figure and ledger value is synthetic">Simulator - synthetic data</span>
        <span id="badge-mock-slot"></span>
        <span class="spacer"></span>
        <span class="status" id="status" role="status" aria-live="polite">Loading results...</span>
        <button type="button" class="btn" id="reload" title="Re-read the results files">Reload</button>
      </header>
      <div id="banner"></div>
      <main id="main" tabindex="-1" aria-live="off"></main>
    </div>
  </div>

  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/chart.umd.min.js"></script>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
